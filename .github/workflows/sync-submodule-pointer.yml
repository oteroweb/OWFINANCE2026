name: Sync Submodule Pointer

# OWF-295: reemplaza el paso manual de correr sync-submodule-pointers.sh a mano
# después de mergear a main en frontend/backend. Cada uno de esos repos dispara
# un repository_dispatch hacia acá (ver su propio ci.yml, job "notify-central")
# justo después de que su CI pase en push a main; este workflow actualiza el
# puntero del submódulo correspondiente y commitea/pushea al repo central.
#
# Requiere el secret SUBMODULES_DEPLOY_KEY (mismo que ya usa deploy.yml para el
# checkout con submódulos privados — ver OWF-291) para poder leer los repos
# privados de frontend/backend al hacer `git submodule update --remote`.
#
# BLOQUEADO PARA VERIFICACIÓN (2026-07-25): la cuenta de GitHub tiene todos los
# Actions bloqueados por un problema de billing (ver OWF-290/291/292) — este
# workflow no puede confirmarse corriendo de verdad hasta que eso se resuelva.
# Código completo, sin probar en CI real.

on:
  repository_dispatch:
    types: [frontend-updated, backend-updated]

concurrency:
  group: sync-submodule-pointer
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ${{ github.event.action }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout central (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ssh-key: ${{ secrets.SUBMODULES_DEPLOY_KEY }}
          ref: master

      - name: Resolve submodule path from event type
        id: which
        run: |
          if [ "${{ github.event.action }}" = "frontend-updated" ]; then
            echo "path=OWFinanceFrontend2025" >> "$GITHUB_OUTPUT"
          else
            echo "path=OWFINANCEBackend2025" >> "$GITHUB_OUTPUT"
          fi

      - name: Update submodule pointer to latest main
        run: git submodule update --remote --merge "${{ steps.which.outputs.path }}"

      - name: Commit and push if the pointer moved
        run: |
          if git diff --quiet -- "${{ steps.which.outputs.path }}"; then
            echo "Puntero ya al día, nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.which.outputs.path }}"
          git commit -m "chore(submodule): auto-sync ${{ steps.which.outputs.path }} → ${{ github.event.client_payload.sha }}"
          git push origin HEAD:master
