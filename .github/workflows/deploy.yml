name: Deploy OWFinance

on:
  push:
    branches:
      - master
      - stage

# Solo un deploy a la vez por entorno
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → ${{ github.ref_name == 'master' && 'prod' || 'stage' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}

    env:
      DEPLOY_ENV:               ${{ github.ref_name == 'master' && 'prod' || 'stage' }}
      DEPLOY_HOST:              ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER:              ${{ secrets.DEPLOY_USER }}
      # OJO: esto NO es el branch del repo central (master/stage) — es el branch
      # que usan los submódulos frontend/backend en si mismos (siempre "main" en
      # ambos hoy), igual que .deploy/prod.sh/stage.sh. Confundir los dos hizo que
      # deploy-frontend.sh intentara "git checkout master" adentro del submódulo,
      # que solo tiene "main", y fallara con "pathspec 'master' did not match".
      DEPLOY_BRANCH:            ${{ github.ref_name == 'master' && 'main' || 'stage' }}
      DEPLOY_SITE_URL:          ${{ secrets.DEPLOY_SITE_URL }}
      DEPLOY_BACKEND_DIR:       ${{ secrets.DEPLOY_BACKEND_DIR }}
      DEPLOY_FRONTEND_DIR:      ${{ secrets.DEPLOY_FRONTEND_DIR }}
      DEPLOY_FRONTEND_ENV_FILE: .env.production
      VITE_API_BASE_URL:        ${{ secrets.DEPLOY_API_URL }}
      DEPLOY_HTACCESS_PATH:     ${{ secrets.DEPLOY_HTACCESS_PATH }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ssh-key: ${{ secrets.SUBMODULES_DEPLOY_KEY }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "DEPLOY_SSH_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

      # OWF-376: la conexión SSH real (no solo el handshake) es rechazada con
      # "Permission denied (publickey,password)" pese a que la llave es correcta
      # (fingerprint verificado, sin restricción `from=` en authorized_keys) —
      # hipótesis fuerte: el hosting bloquea por IP a nivel de panel/CSF/Imunify,
      # no de sshd_config. Este paso imprime la IP pública real del runner para
      # que el usuario la busque en los logs de bloqueo de su panel de hosting.
      - name: Diagnóstico — IP pública del runner (para revisar en el panel de hosting)
        run: |
          echo "IP pública de este runner de GitHub Actions:"
          curl -s https://ifconfig.me || curl -s https://api.ipify.org
          echo ""
          echo "Intento de conexión SSH verbose (para ver en qué fase exacta se rechaza):"
          ssh -vvv -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=10 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" exit 2>&1 | tail -40 || true

      - name: Write deploy config
        # deploy-frontend.sh/deploy-backend.sh cargan .deploy/${DEPLOY_ENV}.sh desde
        # disco (mismo mecanismo que un deploy manual) — ese archivo esta en
        # .gitignore y nunca existe en un checkout de CI. Lo reconstruimos acá desde
        # los secrets ya resueltos como env de este job (incluye DEPLOY_SSH_KEY, que
        # el paso anterior ya reescribió como ruta al archivo de la llave).
        run: |
          mkdir -p .deploy
          cat > ".deploy/${DEPLOY_ENV}.sh" <<EOF
          export DEPLOY_ENV="${DEPLOY_ENV}"
          export DEPLOY_HOST="${DEPLOY_HOST}"
          export DEPLOY_USER="${DEPLOY_USER}"
          export DEPLOY_SSH_KEY="${DEPLOY_SSH_KEY}"
          export DEPLOY_BRANCH="${DEPLOY_BRANCH}"
          export DEPLOY_SITE_URL="${DEPLOY_SITE_URL}"
          export DEPLOY_API_URL="${VITE_API_BASE_URL}"
          export DEPLOY_BACKEND_DIR="${DEPLOY_BACKEND_DIR}"
          export DEPLOY_FRONTEND_DIR="${DEPLOY_FRONTEND_DIR}"
          export DEPLOY_FRONTEND_ENV_FILE="${DEPLOY_FRONTEND_ENV_FILE}"
          export DEPLOY_HTACCESS_PATH="${DEPLOY_HTACCESS_PATH}"
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OWFinanceFrontend2025/package-lock.json

      - name: Install frontend deps
        working-directory: OWFinanceFrontend2025
        run: npm ci

      - name: Build frontend
        working-directory: OWFinanceFrontend2025
        run: npx quasar build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Deploy frontend
        run: bash deploy-frontend.sh "$DEPLOY_ENV" "CI deploy ${{ github.sha }}"

      - name: Deploy backend
        run: bash deploy-backend.sh "$DEPLOY_ENV"

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_SITE_URL/up")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health OK: HTTP $STATUS"
