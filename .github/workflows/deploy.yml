name: Deploy OWFinance

on:
  push:
    branches:
      - master
      - stage

# Solo un deploy a la vez por entorno
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → ${{ github.ref_name == 'master' && 'prod' || 'stage' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}

    env:
      DEPLOY_ENV:               ${{ github.ref_name == 'master' && 'prod' || 'stage' }}
      DEPLOY_HOST:              ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER:              ${{ secrets.DEPLOY_USER }}
      DEPLOY_BRANCH:            ${{ github.ref_name }}
      DEPLOY_SITE_URL:          ${{ secrets.DEPLOY_SITE_URL }}
      DEPLOY_BACKEND_DIR:       ${{ secrets.DEPLOY_BACKEND_DIR }}
      DEPLOY_FRONTEND_DIR:      ${{ secrets.DEPLOY_FRONTEND_DIR }}
      DEPLOY_FRONTEND_ENV_FILE: .env.production
      VITE_API_BASE_URL:        ${{ secrets.DEPLOY_API_URL }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "DEPLOY_SSH_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: OWFinanceFrontend2025/package-lock.json

      - name: Install frontend deps
        working-directory: OWFinanceFrontend2025
        run: npm ci

      - name: Build frontend
        working-directory: OWFinanceFrontend2025
        run: npx quasar build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}

      - name: Deploy frontend
        run: bash deploy-frontend.sh "$DEPLOY_ENV" "CI deploy ${{ github.sha }}"

      - name: Deploy backend
        run: bash deploy-backend.sh "$DEPLOY_ENV"

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_SITE_URL/up")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health OK: HTTP $STATUS"
